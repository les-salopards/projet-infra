<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- réseau edge -->
  <rect x="235" y="40" width="560" height="560" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="255" y="68" font-weight="700" fill="#1d4ed8">réseau edge</text>

  <rect x="255" y="250" width="170" height="104" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="340" y="280" text-anchor="middle" font-weight="700">Caddy</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#475569">reverse proxy</text>
  <text x="340" y="317" text-anchor="middle" font-size="12" fill="#475569">tls internal (CA Caddy)</text>
  <text x="340" y="334" text-anchor="middle" font-size="12" fill="#475569">alias auth.DOMAIN</text>

  <rect x="540" y="90" width="220" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="116" text-anchor="middle" font-weight="600">authentik-server</text>
  <text x="650" y="136" text-anchor="middle" font-size="12" fill="#475569">IdP OIDC · auth.DOMAIN</text>

  <rect x="540" y="170" width="220" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="196" text-anchor="middle" font-weight="600">authentik-worker</text>
  <text x="650" y="216" text-anchor="middle" font-size="12" fill="#475569">applique le blueprint</text>

  <rect x="540" y="330" width="220" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="356" text-anchor="middle" font-weight="600">Rallly</text>
  <text x="650" y="376" text-anchor="middle" font-size="12" fill="#475569">image du fork · rallly.DOMAIN</text>

  <rect x="540" y="500" width="220" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="526" text-anchor="middle" font-weight="600">Mailpit</text>
  <text x="650" y="546" text-anchor="middle" font-size="12" fill="#475569">SMTP de lab · mail.DOMAIN</text>

  <rect x="255" y="470" width="170" height="64" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="340" y="496" text-anchor="middle" font-weight="600" font-size="14">caddy-ca (one-shot)</text>
  <text x="340" y="516" text-anchor="middle" font-size="12" fill="#475569">copie la CA racine</text>

  <!-- navigateur -->
  <rect x="12" y="270" width="150" height="64" rx="32" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="87" y="298" text-anchor="middle" font-weight="600">Navigateur</text>
  <text x="87" y="317" text-anchor="middle" font-size="11" fill="#475569">VPN NetBird (VM)</text>
  <line x1="162" y1="302" x2="252" y2="302" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="292" text-anchor="middle" font-size="12" fill="#334155">HTTPS</text>
  <text x="87" y="360" text-anchor="middle" font-size="11" fill="#64748b">seuls ports publiés</text>
  <text x="87" y="375" text-anchor="middle" font-size="11" fill="#64748b">de la stack : 80 / 443</text>

  <!-- flux Caddy -> apps -->
  <path d="M425,275 C480,250 490,125 538,120" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M425,320 C480,330 500,360 538,360" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M425,340 C470,420 500,525 538,528" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- OIDC Rallly -> Caddy (URL publique) -->
  <path d="M540,375 C480,420 440,380 427,350" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <text x="262" y="392" font-size="12" fill="#c2410c">OIDC par l'URL publique</text>
  <text x="262" y="408" font-size="12" fill="#c2410c">https://auth.DOMAIN</text>

  <!-- CA -> Rallly -->
  <path d="M425,500 C500,470 520,410 560,392" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="300" y="560" font-size="11" fill="#64748b">volume caddy-ca (ro)</text>
  <text x="300" y="575" font-size="11" fill="#64748b">→ NODE_EXTRA_CA_CERTS</text>

  <!-- SMTP -->
  <path d="M760,360 C790,420 790,500 762,520" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M760,205 C800,260 815,470 762,535" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="772" y="440" font-size="11" fill="#64748b">SMTP</text>

  <!-- authentik-internal -->
  <rect x="860" y="80" width="320" height="190" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="878" y="106" font-weight="700" fill="#15803d">authentik-internal</text>
  <text x="878" y="124" font-size="12" fill="#15803d">internal : sans Internet</text>
  <path d="M955,160 a55,12 0 0,0 110,0 v60 a55,12 0 0,1 -110,0 z" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <ellipse cx="1010" cy="160" rx="55" ry="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1010" y="200" text-anchor="middle" font-weight="600" font-size="14">authentik-db</text>
  <text x="1010" y="218" text-anchor="middle" font-size="12" fill="#475569">Postgres 18</text>
  <line x1="760" y1="120" x2="953" y2="185" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="760" y1="200" x2="953" y2="200" stroke="#16a34a" stroke-width="1.5"/>

  <!-- rallly-internal -->
  <rect x="860" y="300" width="320" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="878" y="326" font-weight="700" fill="#15803d">rallly-internal</text>
  <text x="878" y="344" font-size="12" fill="#15803d">internal : sans Internet</text>
  <path d="M955,370 a55,12 0 0,0 110,0 v60 a55,12 0 0,1 -110,0 z" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <ellipse cx="1010" cy="370" rx="55" ry="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1010" y="410" text-anchor="middle" font-weight="600" font-size="14">rallly-db</text>
  <text x="1010" y="428" text-anchor="middle" font-size="12" fill="#475569">Postgres 18</text>
  <line x1="760" y1="360" x2="953" y2="400" stroke="#16a34a" stroke-width="1.5"/>

  <!-- légende -->
  <text x="860" y="520" font-size="13" font-weight="700">Partout</text>
  <text x="860" y="542" font-size="12" fill="#334155">non-root · cap_drop ALL · no-new-privileges</text>
  <text x="860" y="560" font-size="12" fill="#334155">read_only · bases sans port publié</text>
  <text x="860" y="578" font-size="12" fill="#334155">secrets dans .env (gitignoré)</text>
</svg>

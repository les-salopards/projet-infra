# Appliqué automatiquement par le worker au démarrage (et à chaque modification du fichier).
# Les valeurs !Env viennent du .env via compose.yml.
version: 1
metadata:
  name: projet-infra - Rallly (SSO, groupes, invitation, comptes de démo)
entries:
  # Le provider référence ces flows et scopes : on force leur application avant (ordre de chargement non garanti)
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml

  # Groupes : admins = superuser Authentik (comptes, invitations) + Rallly ; users = Rallly uniquement
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: rallly-admins
    attrs:
      is_superuser: true
  - model: authentik_core.group
    id: group-users
    identifiers:
      name: rallly-users
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Rallly
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: rallly
      client_secret: !Env RALLLY_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://rallly.%s/api/auth/callback/oidc", !Env DOMAIN]
      # Le scope profile inclut le claim groups (utilisé par la feature « sondage réservé à un groupe »)
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      # RS256 plutôt que HS256 (voir docs/security.md, CVE PyJWT)
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: app
    identifiers:
      slug: rallly
    attrs:
      name: Rallly
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://rallly.%s", !Env DOMAIN]
      policy_engine_mode: any

  # Accès à Rallly : membres de l'un des deux groupes ; tout autre compte est refusé par Authentik
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf group-admins
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf group-users
    attrs:
      order: 10

  # Invitation externe : lien généré par un admin (Annuaire > Invitations) -> inscription -> groupe rallly-users
  - model: authentik_flows.flow
    id: flow-invitation
    identifiers:
      slug: rallly-invitation
    attrs:
      name: Invitation Rallly
      title: Bienvenue, créez votre compte
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_stages_invitation.invitationstage
    id: stage-invitation
    identifiers:
      name: rallly-invitation-check
    attrs:
      continue_flow_without_invitation: false
  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers:
      name: rallly-invitation-field-username
    attrs:
      field_key: username
      label: Identifiant
      type: username
      required: true
      placeholder: Identifiant
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers:
      name: rallly-invitation-field-name
    attrs:
      field_key: name
      label: Nom complet
      type: text
      required: true
      placeholder: Nom complet
      order: 1
  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers:
      name: rallly-invitation-field-email
    attrs:
      field_key: email
      label: E-mail
      type: email
      required: true
      placeholder: E-mail
      order: 2
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: rallly-invitation-field-password
    attrs:
      field_key: password
      label: Mot de passe
      type: password
      required: true
      placeholder: Mot de passe
      order: 3
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: rallly-invitation-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Mot de passe (confirmation)
      type: password
      required: true
      placeholder: Mot de passe (confirmation)
      order: 4
  - model: authentik_stages_prompt.promptstage
    id: stage-prompt
    identifiers:
      name: rallly-invitation-prompt
    attrs:
      fields:
        - !KeyOf field-username
        - !KeyOf field-name
        - !KeyOf field-email
        - !KeyOf field-password
        - !KeyOf field-password-repeat
  - model: authentik_stages_user_write.userwritestage
    id: stage-write
    identifiers:
      name: rallly-invitation-write
    attrs:
      user_creation_mode: always_create
      user_type: external
      user_path_template: users/external
      create_users_group: !KeyOf group-users
  - model: authentik_stages_user_login.userloginstage
    id: stage-login
    identifiers:
      name: rallly-invitation-login
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      stage: !KeyOf stage-invitation
      order: 0
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      stage: !KeyOf stage-prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      stage: !KeyOf stage-write
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      stage: !KeyOf stage-login
      order: 30

  # Comptes de démo (mot de passe = DEMO_PASSWORD du .env)
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice (utilisatrice)
      email: alice@example.com
      password: !Env DEMO_PASSWORD
      groups: [!KeyOf group-users]
  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob (admin)
      email: bob@example.com
      password: !Env DEMO_PASSWORD
      groups: [!KeyOf group-admins]
  - model: authentik_core.user
    identifiers:
      username: charlie
    attrs:
      name: Charlie (sans groupe)
      email: charlie@example.com
      password: !Env DEMO_PASSWORD
      groups: []
